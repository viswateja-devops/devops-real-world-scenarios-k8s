name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ./MyAspNetApp.sln

      - name: Build
        run: dotnet build ./MyAspNetApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./MyAspNetApp.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ./MyAspNetApp.sln --configuration Release --output ./publish --no-build